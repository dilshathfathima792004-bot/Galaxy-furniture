<!DOCTYPE html>
<html lang="en">

<body>
  <header>
    <nav>
      <div class="logo">GALAXY <span>FURNITURE</span></div>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Products</a></li>

        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="page">
    <h1>Contact Us / Enquire</h1>
    <div class="contact-wrap">
      <form id="inquiry-form">
        <input type="text" id="name" placeholder="Your Name *" required>
        <input type="tel" id="phone" placeholder="Phone Number *" required>
        <input type="email" id="email" placeholder="Email (optional)">
        <textarea id="message" placeholder="What are you looking for? *" rows="5" required></textarea>
        <button type="submit" class="btn">Send Enquiry</button>
        <p id="form-status"></p>
      </form>
      <div class="contact-info">
        <h3>Showroom</h3>
        <p>No.3, Easwaran Nagar, Vellalar Street, Chennai - 600 075</p>
        <p>📞 74488 82468 / 70922 22468</p>
        <p>✉️ galaxytfm@gmail.com</p>
        <a class="btn whatsapp" href="https://wa.me/917448882468" target="_blank">Chat on WhatsApp</a>
      </div>
    </div>
  </main>

  <footer><p>&copy; 2026 Galaxy Furniture</p></footer>
  <script src="app.js"></script>
</body>
</html>
